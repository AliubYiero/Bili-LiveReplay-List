<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>游戏纠错 · Bili-LiveReplay-List</title>
	<link rel="stylesheet" href="./styles.css" />
	<link rel="stylesheet" href="./games.css" />
</head>
<body>
	<header class="topbar">
		<div class="topbar__inner">
			<div class="topbar__brand">
				<div class="topbar__heading">
					<h1 class="topbar__title">本地数据编辑器</h1>
					<nav class="tabs">
						<a class="tab" href="/">拼写规则</a>
						<a class="tab" href="/records">录播数据</a>
						<a class="tab tab--active" href="/games" aria-current="page">游戏纠错</a>
					</nav>
				</div>
				<p class="topbar__hint">修改后自动保存到 data/SpellingCorrections.json 的 uidRules</p>
			</div>
			<div class="topbar__actions">
				<input
					id="search"
					class="input input--search"
					type="search"
					placeholder="搜索游戏名…"
					autocomplete="off"
					spellcheck="false"
				/>
				<div id="save-status" class="status" role="status" aria-live="polite">正在加载…</div>
			</div>
		</div>
	</header>

	<main id="app" class="main">
		<p class="placeholder">正在加载用户列表…</p>
	</main>

	<script src="./games.js"></script>
</body>
</html>
