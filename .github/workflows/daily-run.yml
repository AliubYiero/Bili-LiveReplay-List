name: Daily Data Report

on:
  schedule:
    - cron: '0 4 * * *'  # UTC 04:00 (北京时间 12:00)
  workflow_dispatch:

# ✅ contents: write 用于把 data/ 与 docs/markdown/ 提交回 master
# ✅ pages/id-token 用于通过 Actions 部署 GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 避免两次部署互相打断（进行中的生产部署不取消）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. 检出代码（启用写权限）
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ 关键：pnpm 版本必须与本地一致（pnpm-lock.yaml 为 lockfileVersion 9.0，
      #    pnpm-workspace.yaml 也使用了 pnpm 10+ 的配置字段；pnpm 8 无法解析，会直接报错）
      # ⚠️ 不要在此处写 version：版本以 package.json 的 packageManager 字段为唯一来源，
      #    两处都写会让 action-setup 直接报 "Multiple versions of pnpm specified"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4  # 官方维护的 Action，自动读取 packageManager

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Playwright 要求 Node 18+，这里跟随当前 LTS
          node-version: '22'
          cache: 'pnpm'  # 启用 pnpm 专属缓存
          # ✅ 安全处理 lockfile 不存在的情况
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json

      # 4. 安装依赖（pnpm 版）
      - name: Install dependencies
        run: pnpm install  # ✅ 相当于 npm ci

      # 缓存 Chromium，lockfile 变化时重新下载
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # 未命中缓存：下载 Chromium 并安装系统依赖
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # 命中缓存：只补系统依赖，跳过重新下载
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # 5. 生成报告（pnpm 版）
      #    docs/manifest.json 与 docs/data/** 是 generateWebData 的产物，已被 .gitignore 忽略，
      #    只作为下面的 Pages artifact 上传，不进 git（docs/index.html 是提交进仓库的静态页）
      - name: Generate report
        id: generate
        # 单个上传者采集失败时，其余上传者与 web 产物仍会正常生成；
        # 这里先不中断，让部署照常进行。单上传者风控只输出 ::warning::（退出码 0），
        # 由 "Report failures" 兜底真正的硬失败（构建 / 文档生成）
        continue-on-error: true
        env:
          # 登录态：未登录时 B 站不返回空间主页投稿列表（-352 风控校验失败）
          # 在仓库 Settings → Secrets and variables → Actions 里配置，
          # ⚠️ SESSDATA 是 HttpOnly，document.cookie 读不到，
          #    必须从 DevTools → Application → Cookies → https://www.bilibili.com 复制
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: |
          pnpm build    # ✅ 替换为实际构建命令（如有需要）
          pnpm start # ✅ 替换为 package.json 中定义的生成命令

      # 6. 采集失败时的截图：成功时 debug/ 不存在，if-no-files-found: ignore 会直接跳过
      #    单上传者风控现在只告警不失败，所以不能只在失败时上传
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      # 7. 校验 web 产物：缺失或为空时绝不部署，线上保留上一次成功的版本
      - name: Verify web data
        id: verify
        run: |
          node -e "
          const fs = require('fs');
          const file = 'docs/manifest.json';
          if (!fs.existsSync(file)) {
            console.error('❌ 缺少 ' + file + '，本次不部署（线上保留上一版）');
            process.exit(1);
          }
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const count = Array.isArray(manifest.streamers) ? manifest.streamers.length : 0;
          if (count === 0) {
            console.error('❌ manifest.streamers 为空，本次不部署（线上保留上一版）');
            process.exit(1);
          }
          console.log('✅ manifest 校验通过，主播数: ' + count);
          "

      # 8. 提交报告
      - name: Commit and push report
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          # 智能提交：仅提交变更文件
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          git commit -m "chore: update daily report $(date +'%Y-%m-%d')"
          git push

      # 9. 部署 Pages（仅在产物校验通过时，避免用半成品/空壳覆盖线上）
      - name: Setup Pages
        if: always() && steps.verify.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always() && steps.verify.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        if: always() && steps.verify.outcome == 'success'
        uses: actions/deploy-pages@v4

      # 10. 只有硬失败（构建 / 文档生成）才会走到这里：
      #     单上传者风控由应用输出 ::warning:: 与 step summary，退出码为 0，不会标红。
      #     产物校验已拦截空壳数据，所以标红时线上保留上一版。
      - name: Report failures
        if: always() && steps.generate.outcome == 'failure'
        run: |
          echo "::error::本次有硬失败（构建或文档生成），详见 Generate report 日志"
          {
            echo ""
            echo "### ❌ 本次运行有硬失败"
            echo ""
            echo "构建或文档生成失败，产物可能不完整；若产物校验未通过，线上会保留上一版。"
            echo "单上传者风控失败不会走到这里，它们只输出 \`::warning::\`。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
